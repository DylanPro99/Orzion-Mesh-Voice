workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    triggering:
      events:
        - push
      cancel_previous_builds: true

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - google_credentials
      vars:
        PACKAGE_NAME: "com.orzion.mesh"
        CM_FLUTTER_CLEAN: "true"

    scripts:
      - name: FORZAR LIMPIEZA TOTAL DE CACHÉ
        script: |
          echo "🧹 Eliminando TODA la caché de compilación..."
          flutter clean
          rm -rf build/
          rm -rf .dart_tool/
          rm -rf pubspec.lock
          rm -rf ~/.pub-cache/
          rm -rf /tmp/flutter_tools.*
          rm -rf $HOME/.dartServer
          echo "✅ Caché eliminada completamente"

      - name: Get Flutter packages (fresh)
        script: |
          flutter packages pub get

      - name: Verify wifi_direct_service.dart
        script: |
          echo "📋 Verificando que NO existan tipos problemáticos..."
          if grep -E "WifiP2pDevice|Socket|FlutterP2pConnection\(\)" lib/services/wifi_direct_service.dart; then
            echo "❌ ERROR: Archivo contiene código antiguo"
            exit 1
          else
            echo "✅ Archivo limpio - sin tipos problemáticos"
          fi

      - name: Analyze code
        script: |
          flutter analyze

      - name: Run tests
        script: |
          flutter test || true

      - name: Build APK
        script: |
          flutter build apk --release --split-per-abi

      - name: Build App Bundle
        script: |
          flutter build appbundle --release

    artifacts:
      - build/app/outputs/**/*.apk
      - build/app/outputs/**/*.aab
      - build/**/outputs/**/*.json
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - usuario@example.com
        notify:
          success: true
          failure: true