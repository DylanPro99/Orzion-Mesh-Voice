workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      groups:
        - google_play # Configura tus credenciales en CodeMagic UI
      vars:
        PACKAGE_NAME: "com.orzion.mesh"
    
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      
      - name: Clean previous builds
        script: |
          flutter clean
          rm -rf build/
          rm -rf .dart_tool/
      
      - name: Analyze code
        script: |
          flutter analyze
      
      - name: Run tests
        script: |
          flutter test || true
      
      - name: Build APK
        script: |
          flutter build apk --release --split-per-abi
      
      - name: Build App Bundle
        script: |
          flutter build appbundle --release
    
    artifacts:
      - build/app/outputs/**/*.apk
      - build/app/outputs/**/*.aab
      - build/**/outputs/**/*.json
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log
    
    publishing:
      email:
        recipients:
          - usuario@example.com
        notify:
          success: true
          failure: true
